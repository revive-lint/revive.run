name: Build

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the website is up to date with the latest revive release
        type: boolean
        default: false
  schedule:
    # Twice a month: rebuild the website if revive-lint/revive has a new release
    - cron: '0 6 1,15 * *'

# Don't let two runs commit at the same time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Commit and push docs/
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check for a new revive release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          current=$(cat REVIVE_VERSION 2>/dev/null || true)
          latest=$(gh release view --repo revive-lint/revive --json tagName --jq .tagName)
          echo "current=$current latest=$latest force=$FORCE"
          if [ "$current" = "$latest" ] && [ "$FORCE" != "true" ]; then
            echo "Website is up to date, nothing to do"
            exit 0
          fi
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

      - if: steps.release.outputs.tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: revive-lint/revive
          ref: ${{ steps.release.outputs.tag }}
          path: revive
          persist-credentials: false

      - if: steps.release.outputs.tag
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - if: steps.release.outputs.tag
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true

      - if: steps.release.outputs.tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          go run ./scripts/website
          hugo --gc --minify --cleanDestinationDir
          echo "$TAG" > REVIVE_VERSION

      - if: steps.release.outputs.tag
        uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0 # v6.0.1
        with:
          commit_message: "docs: update to revive ${{ steps.release.outputs.tag }}"
          file_pattern: docs REVIVE_VERSION
