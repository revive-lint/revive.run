name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  hugo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The release the published website is built from; falls back to the default branch
      - id: revive
        run: echo "tag=$(cat REVIVE_VERSION 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: revive-lint/revive
          ref: ${{ steps.revive.outputs.tag }}
          path: revive
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true

      - run: go run ./scripts/website

      # Build to a temporary directory so the committed docs/ stays untouched
      - run: hugo --gc --minify --destination "$RUNNER_TEMP/site" --printPathWarnings --panicOnWarning
